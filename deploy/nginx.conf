# Round-robins between the two replicas so a burst of identical requests is
# genuinely spread across processes. That is what makes the cross-instance
# coordination observable: without it, traffic could land on one replica and
# in-process singleflight alone would appear sufficient.

upstream proxy_backend {
    server app:8080;
    server app-2:8080;
}

server {
    listen 8080;

    location / {
        proxy_pass http://proxy_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Surfaces which replica answered, so a cache hit can be attributed to
        # the instance that served it rather than guessed at.
        add_header X-Served-By $upstream_addr always;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
